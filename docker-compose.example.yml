name: 9rtksync-stack

services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: unless-stopped
    ports:
      # Porta interna 20128 (padrao do 9Router); publicada em 8081 no host.
      # A 20128 do host fica para a stack do artigo (claudegravity), que usa
      # a porta padrao -- assim as duas rodam juntas sem colidir.
      - "127.0.0.1:8081:20128"
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_BASE_URL=http://localhost:20128
      - NODE_ENV=production
      # Sem valor de fallback: um default publicado em arquivo de exemplo vira
      # a senha real de toda implantacao que so copiou e colou. O compose
      # recusa subir ate que as duas variaveis estejam definidas no .env.
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:?defina INITIAL_PASSWORD no .env}
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      - REQUIRE_API_KEY=false
      # REQUIRE_LOGIN=false so e aceitavel porque a porta acima esta presa em
      # 127.0.0.1. Ao expor 20128 na rede, mude para true.
      - REQUIRE_LOGIN=false
    volumes:
      - 9router_data:/app/data

  9rtksync:
    image: ghcr.io/pathbit/9rtksync:latest
    container_name: 9rtksync
    restart: unless-stopped
    ports:
      # Porta interna 9090 (igual no OminiRTKSync); publicada em 9091 no host.
      # O bind em 127.0.0.1 mantem o painel e o SQLite fora da internet.
      - "127.0.0.1:9091:9090"
    volumes:
      - 9router_data:/app/data
      - ${HOME}:/root/host:ro
      - 9rtksync_logs:/app/data/logs
    environment:
      - HOST_HOME=/root/host
      - DB_PATH=/app/data/db/data.sqlite
      - ROUTER_URL=${ROUTER_URL:-http://9router:20128}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-300}
      - REFRESH_MARGIN=${REFRESH_MARGIN:-900}
      - CRON_ENABLED=${CRON_ENABLED:-1}
      # - CRON_INTERVAL=300        # herda SYNC_INTERVAL quando omitido
      - ENABLE_WEB_DASHBOARD=${ENABLE_WEB_DASHBOARD:-1}
      - WEB_PORT=${WEB_PORT:-9090}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      # Credencial de emergencia (usuario 'admin' + este valor como senha).
      # Se omitida, e gerada no primeiro boot e registrada no arquivo de log.
      # - DASHBOARD_RECOVERY_HASH=
      # Validacao viva de credenciais: pergunta ao provedor se a chave ainda e
      # aceita, em vez de assumir que uma conexao esta saudavel por carregar uma
      # credencial. Anunciadas no .env.example e lidas pelo Settings, faltava
      # repassa-las ao container.
      - CREDENTIAL_CHECK_ENABLED=${CREDENTIAL_CHECK_ENABLED:-1}
      - CREDENTIAL_CHECK_TIMEOUT=${CREDENTIAL_CHECK_TIMEOUT:-8}
      - LOG_DIR=${LOG_DIR:-/app/data/logs}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - 9router
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  9router_data:
  9rtksync_logs:
