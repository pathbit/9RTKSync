name: Feature Request / Provider Suggestion
description: Suggest a new feature, connection provider, or enhancement for 9RTKSync
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests and suggestions from the developer community are warmly welcomed!
  - type: textarea
    id: problem
    attributes:
      label: What problem does this feature solve?
      description: Explain your use case or current limitation
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution Description
      description: How do you envision this new capability working?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Are there workarounds or related tools you evaluated?

