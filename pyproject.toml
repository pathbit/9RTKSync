[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "9RTKSync"
version = "1.0.0"
description = "9Router Universal Token & Connection Synchronizer"
readme = "README.md"
authors = [
    { name = "Eliel Sousa", email = "eliel@pathbit.co" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["9router", "oauth", "token-sync", "llm", "antigravity", "claude-code"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.optional-dependencies]
# SAML2 nao sai com a biblioteca padrao: a assinatura e sobre canonicalizacao
# exclusiva 1.0 (o `canonicalize` do xml.etree e C14N 2.0, outro algoritmo), nao
# ha verificacao RSA na stdlib, e amarrar a referencia da assinatura ao elemento
# efetivamente lido -- a defesa contra o deslocamento da assercao na arvore -- e
# trabalho de biblioteca. Extra opcional: quem so usa OIDC nao carrega nada, e o
# codigo importa a biblioteca dentro da funcao.
saml = ["python3-saml>=1.16"]
test = [
    "docker>=7.0.0",
    "testcontainers>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/pathbit/9RTKSync"
Repository = "https://github.com/pathbit/9RTKSync"
Issues = "https://github.com/pathbit/9RTKSync/issues"

[project.scripts]
9rtksync = "nine_rtksync.cli:main"
9RTKSync = "nine_rtksync.cli:main"
9connsync = "nine_rtksync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["locales/*.json"]

# A suite tem de rodar sem depender de `pip install -e`. Sem isto, o repo
# que por acaso tem uma instalacao editavel na maquina passa e o irmao
# reprova na coleta -- com o mesmo codigo. Foi o que aconteceu aqui.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
